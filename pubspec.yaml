name: homeease
description: HomeEase - Home Services Booking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase (updated for Flutter 3.44+)
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8
  firebase_messaging: ^15.2.6
  firebase_storage: ^12.4.6

  # State Management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Forms & Validation
  intl: ^0.20.2

  # QR Code
  qr_flutter: ^4.1.0

  # Storage
  shared_preferences: ^2.3.4

  # Network
  http: ^1.2.2

  # Icons
  cupertino_icons: ^1.0.8

  # Google Sign In
  google_sign_in: ^6.2.2

  # Image Picker
  image_picker: ^1.1.2

  # URL Launcher
  url_launcher: ^6.3.1

  # Google Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # UUID
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
